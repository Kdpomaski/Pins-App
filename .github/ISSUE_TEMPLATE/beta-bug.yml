name: Beta bug (TestFlight)
description: Report a bug from Pins / Pins Pets External TestFlight
title: "[Beta] "
labels: ["bug", "beta", "from-testflight"]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options: ["Pins", "Pins Pets", "Both"]
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build number
      placeholder: "e.g. 1.0.1 (11)"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["P0 crash/data loss/auth", "P1 major feature", "P2 UX/minor", "P3 polish"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / iOS
      placeholder: "iPhone 15 · iOS 18"
  - type: textarea
    id: extras
    attributes:
      label: Screenshots / notes
